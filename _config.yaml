# site properties and page defaults
title: Eco-GenX
subtitle: Engineering nature
description: We herstellen bodem en water met fytotechnologie - planten, microben, gerichte additieven en DNA-bewijs.
header: images/background.jpg
footer: images/background.jpg
url: "https://sofie8.github.io"
baseurl: "/eco-genx"

proofer: false

# site social media and other links
links:
  github: CU-DBMI

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default

  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member

  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

  # project items in /_projects
  - scope:
      type: "projects"
    values:
      layout: project

collections:
  # generate page for each member
  members:
    output: true

  # generate page for each post
  posts:
    output: true

  # generate page for each project
  projects:
    output: true
    permalink: /project/:name/

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff

# markdown options
kramdown:
  entity_output: :as_input
